<!DOCTYPE html>
<html lang="en" class="has-patterned-background">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav>
        <img src="/LOGO.svg" alt="">
        <p style="font-weight: bolder; font-size: 18px;">PT. Umbra Jaya Angkasa</p>
        <hr/>
        <div id="cred" class="cred">
            <form action="/profile" method="get">
                <input type="submit" value="Akun Saya">
            </form>
        </div>
    </nav>

    <section style="margin-top: 10px;display: flex;
    justify-content: center;
    align-items: center;">
        <div style="padding: 10px; background-color: antiquewhite; border: 1px solid black; border-radius: 10px;">
            <h1 style="margin: 0; padding: 0; margin-bottom: 10px;">Login</h1>
            <form action="/do_login" method="post">
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" required><br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required><br><br>
                <a href="/register">Daftar Akun Baru</a>
                <input style="width: 120px;" type="submit" value="Login">
            </form>
        </div>
    </section>
</body>
</html>
