{{define "title"}}Dashboard &mdash; CMS Umbra{{end}}
{{define "content"}}
<section>
  <div class="container">
    <span class="section-label">CMS</span>
    <h1 class="section-title">Dashboard</h1>
  </div>
</section>

{{range .Site.Divisions}}
<section>
  <div class="container">
    <div class="admin-dashboard-header">
      <h2>{{.Name}}</h2>
      <a href="/admin/division/{{.Slug}}" class="nav-btn">Edit</a>
    </div>
    <div class="admin-dashboard-cols">
      {{range .PortfolioColumns}}
      <div>
        <h3 style="font-size:0.9rem;font-weight:600;color:var(--color-muted);margin-bottom:0.5rem;padding-bottom:0.3rem;border-bottom:1px solid rgba(139,92,246,0.2);">{{.Title}} <span style="font-weight:300;color:var(--color-dim);">({{len .Projects}})</span></h3>
        <div style="display:flex;flex-direction:column;gap:0.25rem;">
          {{range .Projects}}
          <div style="padding:0.4rem 0;">
            <div style="font-size:0.7rem;color:var(--color-accent-hover);">{{.Year}}</div>
            <div style="font-size:0.8rem;color:var(--color-muted);">{{.Name}}</div>
          </div>
          {{end}}
        </div>
      </div>
      {{end}}
    </div>
  </div>
</section>
{{end}}
{{end}}
