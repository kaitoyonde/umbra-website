<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(139,92,246,0.05);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgba(139,92,246,0.08);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(139,92,246,0.03);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Gradient base -->
  <rect width="1200" height="800" fill="url(#grad3)"/>
  
  <!-- Representing knowledge nodes and connections -->
  <g opacity="0.06">
    <!-- Central knowledge hub -->
    <circle cx="600" cy="400" r="200" fill="none" stroke="rgba(139,92,246,0.4)" stroke-width="1" stroke-dasharray="5,5" />
    <circle cx="600" cy="400" r="140" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="1" stroke-dasharray="5,5" />
    <circle cx="600" cy="400" r="80" fill="none" stroke="rgba(139,92,246,0.25)" stroke-width="1" stroke-dasharray="5,5" />
  </g>
  
  <!-- Knowledge points radiating outward -->
  <g opacity="0.05" fill="rgba(139,92,246,0.3)">
    <circle cx="150" cy="100" r="8" />
    <circle cx="1050" cy="150" r="8" />
    <circle cx="100" cy="700" r="8" />
    <circle cx="1100" cy="650" r="8" />
    <circle cx="600" cy="80" r="8" />
    <circle cx="600" cy="720" r="8" />
  </g>
  
  <!-- Connecting lines to knowledge -->
  <g opacity="0.03" stroke="rgba(139,92,246,0.2)" stroke-width="1">
    <line x1="600" y1="400" x2="150" y2="100" />
    <line x1="600" y1="400" x2="1050" y2="150" />
    <line x1="600" y1="400" x2="100" y2="700" />
    <line x1="600" y1="400" x2="1100" y2="650" />
    <line x1="600" y1="400" x2="600" y2="80" />
    <line x1="600" y1="400" x2="600" y2="720" />
  </g>
</svg>