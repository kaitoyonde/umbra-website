<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gradProj2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(139,92,246,0.08);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgba(139,92,246,0.04);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(139,92,246,0.02);stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Base gradient -->
  <rect width="1200" height="800" fill="url(#gradProj2)"/>

  <!-- Tech-inspired pattern -->
  <g opacity="0.04" fill="none" stroke="rgba(139,92,246,0.25)" stroke-width="1.5">
    <!-- Tech boxes -->
    <rect x="100" y="100" width="150" height="150" />
    <rect x="350" y="200" width="150" height="150" />
    <rect x="600" y="150" width="150" height="150" />
    <rect x="850" y="250" width="150" height="150" />
    
    <rect x="200" y="500" width="150" height="150" />
    <rect x="550" y="550" width="150" height="150" />
    <rect x="900" y="500" width="150" height="150" />
  </g>

  <!-- Connecting lines between boxes -->
  <g opacity="0.03" stroke="rgba(139,92,246,0.2)" stroke-width="1" stroke-dasharray="5,5">
    <line x1="175" y1="175" x2="325" y2="250" />
    <line x1="425" y1="275" x2="575" y2="225" />
    <line x1="675" y1="225" x2="825" y2="300" />
    <line x1="275" y1="575" x2="425" y2="275" />
    <line x1="625" y1="625" x2="825" y2="325" />
  </g>

  <!-- Corner decorations -->
  <g opacity="0.04" fill="none" stroke="rgba(139,92,246,0.2)" stroke-width="2">
    <circle cx="50" cy="50" r="30" />
    <circle cx="1150" cy="50" r="30" />
    <circle cx="50" cy="750" r="30" />
    <circle cx="1150" cy="750" r="30" />
  </g>
</svg>