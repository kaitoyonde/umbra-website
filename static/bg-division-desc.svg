<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="gradDiv1" cx="30%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:rgba(139,92,246,0.08);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(139,92,246,0.01);stop-opacity:1" />
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" />
    </filter>
  </defs>

  <!-- Base gradient -->
  <rect width="1200" height="800" fill="url(#gradDiv1)"/>

  <!-- Flowing abstract shapes -->
  <g opacity="0.05" filter="url(#softGlow)">
    <path d="M 0 150 Q 300 100 600 150 T 1200 150 L 1200 250 Q 600 300 0 250 Z" fill="rgba(139,92,246,0.25)" />
    <path d="M 0 500 Q 400 450 600 550 T 1200 500 L 1200 650 Q 600 600 0 650 Z" fill="rgba(139,92,246,0.2)" />
  </g>

  <!-- Circular elements -->
  <g opacity="0.04" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="1.5">
    <circle cx="200" cy="300" r="60" />
    <circle cx="1000" cy="450" r="80" />
    <circle cx="600" cy="200" r="50" />
    <circle cx="300" cy="700" r="70" />
    <circle cx="950" cy="150" r="55" />
  </g>

  <!-- Subtle grid -->
  <g opacity="0.02" stroke="rgba(255,255,255,0.2)" stroke-width="1">
    <defs>
      <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
        <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect width="1200" height="800" fill="url(#grid)" />
  </g>

  <!-- Accent lines -->
  <g opacity="0.03" stroke="rgba(139,92,246,0.15)" stroke-width="2">
    <line x1="150" y1="0" x2="150" y2="800" stroke-dasharray="10,10" />
    <line x1="1050" y1="0" x2="1050" y2="800" stroke-dasharray="10,10" />
  </g>
</svg>