<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="grad5" cx="50%" cy="80%" r="80%">
      <stop offset="0%" style="stop-color:rgba(139,92,246,0.12);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(139,92,246,0.02);stop-opacity:1" />
    </radialGradient>
    <filter id="motionBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" />
    </filter>
  </defs>
  
  <!-- Gradient base -->
  <rect width="1200" height="800" fill="url(#grad5)"/>
  
  <!-- Connection nodes and paths -->
  <g opacity="0.05" filter="url(#motionBlur)">
    <!-- Top nodes -->
    <circle cx="200" cy="100" r="12" fill="rgba(139,92,246,0.4)" />
    <circle cx="600" cy="50" r="12" fill="rgba(139,92,246,0.4)" />
    <circle cx="1000" cy="120" r="12" fill="rgba(139,92,246,0.4)" />
    
    <!-- Central node -->
    <circle cx="600" cy="400" r="15" fill="rgba(139,92,246,0.5)" />
    
    <!-- Bottom nodes -->
    <circle cx="150" cy="700" r="12" fill="rgba(139,92,246,0.4)" />
    <circle cx="600" cy="750" r="12" fill="rgba(139,92,246,0.4)" />
    <circle cx="1050" cy="680" r="12" fill="rgba(139,92,246,0.4)" />
  </g>
  
  <!-- Connection lines -->
  <g opacity="0.04" stroke="rgba(139,92,246,0.3)" stroke-width="1.5" fill="none">
    <line x1="200" y1="100" x2="600" y2="400" />
    <line x1="600" y1="50" x2="600" y2="400" />
    <line x1="1000" y1="120" x2="600" y2="400" />
    <line x1="600" y1="400" x2="150" y2="700" />
    <line x1="600" y1="400" x2="600" y2="750" />
    <line x1="600" y1="400" x2="1050" y2="680" />
  </g>
  
  <!-- Subtle radiating pattern -->
  <g opacity="0.02" stroke="rgba(139,92,246,0.2)" stroke-width="1" fill="none">
    <circle cx="600" cy="400" r="100" />
    <circle cx="600" cy="400" r="200" />
    <circle cx="600" cy="400" r="300" />
  </g>
</svg>