<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="grad2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:rgba(139,92,246,0.06);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(139,92,246,0.01);stop-opacity:1" />
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
    </filter>
  </defs>
  
  <!-- Base gradient -->
  <rect width="1200" height="800" fill="url(#grad2)"/>
  
  <!-- Three main sections represented as flowing shapes -->
  <g opacity="0.04" filter="url(#softBlur)">
    <!-- Left division -->
    <ellipse cx="250" cy="400" rx="180" ry="280" fill="rgba(139,92,246,0.15)" />
    <!-- Center division -->
    <ellipse cx="600" cy="400" rx="200" ry="300" fill="rgba(139,92,246,0.12)" />
    <!-- Right division -->
    <ellipse cx="950" cy="400" rx="180" ry="280" fill="rgba(139,92,246,0.15)" />
  </g>
  
  <!-- Subtle wave patterns -->
  <g opacity="0.03" stroke="rgba(139,92,246,0.3)" stroke-width="1.5" fill="none">
    <path d="M 0 200 Q 300 180 600 200 T 1200 200" />
    <path d="M 0 400 Q 300 420 600 400 T 1200 400" />
    <path d="M 0 600 Q 300 580 600 600 T 1200 600" />
  </g>
  
  <!-- Vertical accent lines -->
  <g opacity="0.02" stroke="rgba(255,255,255,0.4)" stroke-width="2">
    <line x1="250" y1="0" x2="250" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="950" y1="0" x2="950" y2="800" />
  </g>
</svg>