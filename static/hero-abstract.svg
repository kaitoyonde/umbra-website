<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" />
    </filter>
    <linearGradient id="gradAbstract" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(139,92,246,0.12);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgba(139,92,246,0.06);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(139,92,246,0.02);stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Animated abstract shapes -->
  <g opacity="0.08" filter="url(#blur1)">
    <!-- Large organic blob shapes -->
    <path d="M 100 50 Q 150 20 220 60 Q 280 100 250 180 Q 200 200 150 170 Q 80 140 100 50 Z" fill="rgba(139,92,246,0.4)" />
    <path d="M 950 100 Q 1050 80 1120 150 Q 1150 220 1080 280 Q 980 300 920 250 Q 900 160 950 100 Z" fill="rgba(139,92,246,0.35)" />
    <path d="M 400 300 Q 500 250 600 280 Q 700 310 680 400 Q 600 450 480 440 Q 380 420 400 300 Z" fill="rgba(139,92,246,0.3)" />
    <path d="M 800 400 Q 880 380 950 450 Q 950 540 880 560 Q 780 550 750 480 Q 740 420 800 400 Z" fill="rgba(139,92,246,0.25)" />
  </g>

  <!-- Geometric lines and patterns -->
  <g opacity="0.06" stroke="rgba(139,92,246,0.4)" stroke-width="2" fill="none">
    <!-- Interconnected nodes -->
    <circle cx="150" cy="120" r="8" />
    <circle cx="400" cy="200" r="6" />
    <circle cx="700" cy="150" r="7" />
    <circle cx="1000" cy="250" r="8" />
    <circle cx="600" cy="450" r="6" />
    <circle cx="250" cy="500" r="7" />
    <circle cx="950" cy="500" r="6" />
    
    <!-- Lines connecting nodes -->
    <line x1="150" y1="120" x2="400" y2="200" />
    <line x1="400" y1="200" x2="700" y2="150" />
    <line x1="700" y1="150" x2="1000" y2="250" />
    <line x1="600" y1="450" x2="250" y2="500" />
    <line x1="600" y1="450" x2="950" y2="500" />
  </g>

  <!-- Abstract flowing ribbons -->
  <g opacity="0.04" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="3">
    <path d="M -50 200 Q 150 150 300 200 T 600 250 T 900 200 T 1200 300" />
    <path d="M 0 400 Q 200 350 400 400 T 800 420 T 1200 380" />
  </g>

  <!-- Diagonal accent lines -->
  <g opacity="0.03" stroke="rgba(139,92,246,0.2)" stroke-width="1.5">
    <line x1="0" y1="0" x2="1200" y2="600" />
    <line x1="1200" y1="0" x2="0" y2="600" />
  </g>

  <!-- Corner accents -->
  <g opacity="0.05">
    <rect x="0" y="0" width="100" height="100" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="1" />
    <rect x="1100" y="0" width="100" height="100" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="1" />
    <rect x="0" y="500" width="100" height="100" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="1" />
    <rect x="1100" y="500" width="100" height="100" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="1" />
  </g>
</svg>