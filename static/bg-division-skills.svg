<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="gradDiv3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:rgba(139,92,246,0.05);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(139,92,246,0.01);stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Base gradient -->
  <rect width="1200" height="800" fill="url(#gradDiv3)"/>

  <!-- Hexagonal pattern -->
  <g opacity="0.04" fill="none" stroke="rgba(139,92,246,0.25)" stroke-width="1.5">
    <!-- Top row -->
    <polygon points="150,120 200,90 250,120 250,180 200,210 150,180" />
    <polygon points="350,120 400,90 450,120 450,180 400,210 350,180" />
    <polygon points="550,120 600,90 650,120 650,180 600,210 550,180" />
    <polygon points="750,120 800,90 850,120 850,180 800,210 750,180" />
    <polygon points="950,120 1000,90 1050,120 1050,180 1000,210 950,180" />
    
    <!-- Bottom row -->
    <polygon points="150,620 200,590 250,620 250,680 200,710 150,680" />
    <polygon points="550,620 600,590 650,620 650,680 600,710 550,680" />
    <polygon points="950,620 1000,590 1050,620 1050,680 1000,710 950,680" />
  </g>

  <!-- Diagonal flowing lines -->
  <g opacity="0.03" fill="none" stroke="rgba(139,92,246,0.2)" stroke-width="2">
    <path d="M 0 0 Q 300 200 600 400 T 1200 800" />
    <path d="M 1200 0 Q 900 200 600 400 T 0 800" />
  </g>

  <!-- Pill-shaped elements -->
  <g opacity="0.04" fill="none" stroke="rgba(139,92,246,0.25)" stroke-width="1.5">
    <rect x="100" y="350" width="200" height="80" rx="40" />
    <rect x="900" y="350" width="200" height="80" rx="40" />
  </g>
</svg>